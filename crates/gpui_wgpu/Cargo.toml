[package]
name = "gpui_wgpu"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_wgpu.rs"

[features]
default = []
font-kit = ["dep:font-kit"]
# Default-off on purpose: the contract 1.2 observation counter is test apparatus, and the ordinary
# production graph must not carry its field, its increment or its accessor.
test-support = ["gpui/test-support"]

[dependencies]
gpui.workspace = true
anyhow.workspace = true
bytemuck = "1"
collections.workspace = true
cosmic-text = "0.19.0"
etagere.workspace = true
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
profiling.workspace = true
raw-window-handle.workspace = true
smallvec.workspace = true
swash.workspace = true
unicode-bidi.workspace = true
unicode-segmentation.workspace = true
gpui_util.workspace = true
wgpu.workspace = true

# Optional: only needed on platforms with multiple font sources (e.g. Linux)
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
wgpu = { workspace = true, features = ["webgl"] }

[dev-dependencies]
naga = { version = "29.0.4", features = ["wgsl-in"] }

# The local external-surface registry tests block on headless adapter/device acquisition; upstream
# dropped pollster from the production dependencies and this crate only needs it for those tests.
# Criterion is host-only: its default Rayon path rejects wasm, and the layout_line bench target
# compiles to an empty binary there.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion.workspace = true
pollster.workspace = true

# Only the Metal capability-fingerprint tests need a real CAMetalLayer; the version and features
# mirror the sibling wgpu-hal so the already-locked build is reused.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2.workspace = true
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "CALayer",
    "CAMetalLayer",
] }

[[bench]]
name = "layout_line"
harness = false
